[package]
name = "z-gauges"
version = "0.1.0"
authors = ["Berkeley Martinez"]
edition = "2021"

[dependencies]
esp-idf-sys = { version = "0.35", features = ["binstart"] }
esp-idf-hal = "0.44"
esp-idf-svc = "0.49"
log = "0.4"

[build-dependencies]
embuild = "0.32"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
overflow-checks = false

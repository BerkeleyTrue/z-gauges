[package]
name = "z-gauges"
version = "0.1.0"
authors = ["Berkeley Martinez"]
edition = "2021"

[dependencies]
esp-idf-sys = { version = "0.37", features = ["binstart"] }
esp-idf-hal = "0.46"
esp-idf-svc = "0.52"
log = "0.4"
gc9a01-rs = "0.4.2"
cst816s = "1.0.1"

[build-dependencies]
embuild = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
overflow-checks = false
